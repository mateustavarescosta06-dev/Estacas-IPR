# Publica o site estático no GitHub Pages a cada push na main.
# Ative uma vez em Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera as páginas
        run: python3 build.py
      - name: Monta a pasta publicada
        run: |
          mkdir -p _site
          cp -r index.html assets estacas fundacao central-de-concreto controle-de-qualidade clientes perguntas-frequentes contato _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
